<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To Do List</title>
<meta name="description" content="Karen's to-do list, with reminders, and Frosty on the couch.">
<meta name="theme-color" content="#E6E1D6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D2220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Karen's List">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icon-192.png?v=2">
<link rel="apple-touch-icon" href="assets/icon-180.png?v=2">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one brass-framed tray on a shagreen tabletop; the office scene (Frosty on the couch) on the left, the list on the right. Stacks on phones. */
:root {
  --table: #E6E1D6; --dot: #D3CBBB; --brass: #B08D3E; --brass-soft: #D9C38E;
  --panel: #FBFAF6; --panel-2: #F2EFE7; --ink: #1F2B27; --muted: #69736E; --line: #E2DDD2;
  --teal: #2E6F62; --teal-deep: #1C4A41; --teal-ink: #FFFFFF; --teal-soft: #DDEBE6; --cognac: #A55B2C; --amber: #A86A12; --amber-soft: #F6E8CF; --danger: #A63D2F;
  --shadow: rgba(48, 38, 22, .28);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --table: #1D2220; --dot: #2B322E; --brass: #C7A256; --brass-soft: #6E5A2E;
  --panel: #171C1A; --panel-2: #202624; --ink: #EDE8DD; --muted: #9CA59F; --line: #2D3431;
  --teal: #74C2B1; --teal-deep: #3F8577; --teal-ink: #0F1A17; --teal-soft: #1F3833; --cognac: #D08A55; --amber: #E2A84A; --amber-soft: #3A2F1C; --danger: #E2836F;
  --shadow: rgba(0, 0, 0, .55);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --table: #1D2220; --dot: #2B322E; --brass: #C7A256; --brass-soft: #6E5A2E;
  --panel: #171C1A; --panel-2: #202624; --ink: #EDE8DD; --muted: #9CA59F; --line: #2D3431;
  --teal: #74C2B1; --teal-deep: #3F8577; --teal-ink: #0F1A17; --teal-soft: #1F3833; --cognac: #D08A55; --amber: #E2A84A; --amber-soft: #3A2F1C; --danger: #E2836F;
  --shadow: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background-color: var(--table);
  background-image: radial-gradient(circle, var(--dot) 0 1.3px, transparent 1.8px), radial-gradient(circle, var(--dot) 0 1.1px, transparent 1.6px);
  background-size: 8px 8px, 8px 8px; background-position: 0 0, 4px 4px;
  color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 36px 48px; min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

.tray {
  max-width: 1180px; margin: 0 auto; background: var(--panel); border-radius: 26px; overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
  height: clamp(620px, calc(100vh - 84px), 780px);
  box-shadow: 0 0 0 1.5px var(--brass), 0 0 0 7px var(--panel-2), 0 0 0 8.5px var(--brass), 0 40px 70px -30px var(--shadow);
  margin-block: 9px;
}

/* ---------- scene: the real office photo with Frosty cut out and set on the couch ---------- */
.scene { position: relative; min-width: 0; overflow: hidden; background: #2E2620; }
/* the seam: a sliver of shagreen inlaid between two brass hairlines */
.scene::after {
  content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 9px; z-index: 2; pointer-events: none;
  background-color: var(--table);
  background-image: radial-gradient(circle, var(--dot) 0 1px, transparent 1.4px), radial-gradient(circle, var(--dot) 0 .9px, transparent 1.3px);
  background-size: 5px 5px, 5px 5px; background-position: 0 0, 2.5px 2.5px;
  box-shadow: inset 1px 0 0 var(--brass), inset -1px 0 0 var(--brass), -6px 0 14px -6px rgba(20, 12, 6, .45);
}
.stage { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 1206 / 892; }
.stage .office { position: absolute; inset: 0; width: 100%; height: 100%; display: block; max-width: none; }
.shade-l { position: absolute; border-radius: 50%; pointer-events: none; }
.contact { left: 45.07%; top: 55.4%; width: 7.6%; height: 1.4%; background: rgba(25, 10, 3, .78); filter: blur(3px); }
.cast { left: 47.46%; top: 40.96%; width: 7.39%; height: 13.97%; background: rgba(30, 12, 4, .18); filter: blur(8px); }
.cushion { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; clip-path: inset(56.05% 45.19% 40.25% 42.29%); pointer-events: none; }
.frosty { position: absolute; left: 43.12%; top: 37.11%; width: 10.86%; height: auto; max-width: none; transform-origin: 50% 100%; filter: drop-shadow(0 1px 1px rgba(40, 20, 8, .25)); }
.frosty.cheer { animation: hop .9s cubic-bezier(.3,.7,.4,1); }
@keyframes hop { 0% { transform: translateY(0); } 30% { transform: translateY(-9%) rotate(-3deg); } 55% { transform: translateY(0) rotate(2deg); } 72% { transform: translateY(-3%); } 100% { transform: translateY(0); } }
.vignette { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(20, 14, 10, .35), transparent 22%), radial-gradient(120% 90% at 50% 45%, transparent 60%, rgba(20, 14, 10, .25)); }
.caption {
  position: absolute; left: 16px; bottom: 14px; display: flex; gap: 8px; align-items: center;
  background: rgba(251, 250, 246, .88); backdrop-filter: blur(6px); color: #5D6762;
  border-radius: 999px; padding: 5px 12px 5px 10px; font-size: 12.5px; font-variant-numeric: tabular-nums;
}
.caption b { color: #1F2B27; font-weight: 600; }
.caption .dot { width: 7px; height: 7px; border-radius: 50%; background: #FFC867; box-shadow: 0 0 8px #FFC867; }
.bubble-anchor { position: absolute; left: 48.5%; bottom: 63.9%; transform: translateX(-50%); width: max-content; max-width: 230px; }
.bubble {
  font-family: var(--f-body); font-size: 15px; line-height: 1.3; color: #22302B; background: #FFFDF8; position: relative;
  border: 1.5px solid #2E6F62; border-radius: 16px; padding: 8px 12px;
  box-shadow: 0 8px 20px -8px rgba(0,0,0,.45); opacity: 0; transform: translateY(6px) scale(.96); transform-origin: 50% 100%;
  transition: opacity .25s ease, transform .25s ease;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; background: #FFFDF8; border-right: 1.5px solid #2E6F62; border-bottom: 1.5px solid #2E6F62; transform: translateX(-50%) rotate(45deg); }
.bubble.show { opacity: 1; transform: none; }
.bubble b { font-weight: 600; }
.bubble { pointer-events: none; cursor: pointer; }
.bubble.show { pointer-events: auto; }
/* A greeting stays until it's tapped; the small x says so. */
.bubble.sticky, .note.sticky { padding-right: 32px; }
.bubble .x, .note .x {
  position: absolute; top: 5px; right: 6px; width: 24px; height: 24px; border: 0; border-radius: 50%; padding: 0;
  background: transparent; color: #6B746F; font: 500 18px/24px var(--f-body); cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.bubble .x:hover, .note .x:hover { background: rgba(46, 111, 98, .1); }
.note .x { color: var(--muted); }

/* ---------- list panel ---------- */
.panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { padding: 28px 30px 0; display: grid; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 38px; line-height: 1.05; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1 em { font-style: normal; color: var(--teal); }
.summary { color: var(--muted); font-size: 14px; margin: 2px 0 0; min-height: 21px; }
.summary b { color: var(--ink); font-weight: 600; }

.add { margin: 18px 30px 0; padding: 14px; border-radius: 16px; background: var(--panel-2); border: 1px solid var(--line); display: grid; gap: 12px; }
.add-row { display: flex; gap: 8px; }
.text-in {
  flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel); border-radius: 11px; padding: 10px 12px; font-size: 15px;
}
.text-in::placeholder { color: var(--muted); }
/* Buttons sit on a darker edge, like a key: they rise a hair on hover and press down to it. */
.btn {
  --edge: var(--teal-deep);
  border: 0; border-radius: 11px; padding: 10px 16px; font-weight: 600; cursor: pointer; background: var(--teal); color: var(--teal-ink); white-space: nowrap;
  box-shadow: 0 3px 0 var(--edge), inset 0 1px 0 rgba(255, 255, 255, .22);
  transition: transform .18s cubic-bezier(.3, 1.6, .5, 1), box-shadow .18s cubic-bezier(.3, 1.6, .5, 1), filter .15s ease;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
@media (hover: hover) { .btn:hover:not(:active) { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 4px 0 var(--edge), inset 0 1px 0 rgba(255, 255, 255, .22); } }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge), inset 0 1px 0 rgba(255, 255, 255, .12); transition-duration: .05s; }
.btn:disabled { opacity: .6; cursor: default; transform: none; }
.btn.ghost, .btn.danger { --edge: var(--line); background: var(--panel); border: 1px solid var(--line); box-shadow: 0 2px 0 var(--edge); }
.btn.ghost { color: var(--ink); } .btn.danger { color: var(--danger); }
.btn.ghost:active, .btn.danger:active { transform: translateY(2px); box-shadow: 0 0 0 var(--edge); }
.btn.small { padding: 6px 11px; font-size: 13px; border-radius: 9px; }

.remind { display: grid; gap: 10px; }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 7px 8px; border-radius: 8px; font-size: 13.5px; cursor: pointer; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.seg label svg { width: 14px; height: 14px; flex: none; }
@media (max-width: 420px) { .seg label svg { display: none; } }
.seg input:checked + label { background: var(--teal-soft); color: var(--ink); font-weight: 600; }
.seg label { transition: color .2s ease, transform .15s ease; -webkit-tap-highlight-color: transparent; }
.seg label:active { transform: scale(.95); }
/* Where the browser can tell which option is chosen, one highlight slides between them. */
@supports selector(:has(a)) {
  .seg { position: relative; }
  .seg::before {
    content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 12px) / 4); border-radius: 8px;
    background: var(--teal-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--teal) 18%, transparent);
    transition: transform .38s cubic-bezier(.3, 1.35, .5, 1);
  }
  .seg:has(input[value="once"]:checked)::before { transform: translateX(calc(100% + 2px)); }
  .seg:has(input[value="daily"]:checked)::before { transform: translateX(calc(200% + 4px)); }
  .seg:has(input[value="repeat"]:checked)::before { transform: translateX(calc(300% + 6px)); }
  .seg label { position: relative; z-index: 1; }
  .seg input:checked + label { background: transparent; }
}
.seg input:focus-visible + label { outline: 2px solid var(--teal); outline-offset: 1px; }
.when { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
.when select { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 6px 8px; font-size: 14px; color: var(--ink); }
.when .hint { flex-basis: 100%; font-size: 12.5px; }
.when > span[hidden] { display: none !important; }
.when input { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 6px 9px; font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
.err { color: var(--danger); font-size: 13px; }

.alerts { margin: 10px 30px 0; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.link { background: none; border: 0; padding: 0; color: var(--teal); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }

.lists { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 30px 26px; margin-top: 8px; scrollbar-width: thin; }
.group-h { display: flex; justify-content: space-between; align-items: baseline; margin: 10px 0 4px; }
.group-h h2 { font-family: var(--f-display); font-weight: 500; font-size: 15px; margin: 0; letter-spacing: .01em; }
.group-h .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
ul.tasks { list-style: none; margin: 0; padding: 0; }
.task { border-bottom: 1px solid var(--line); }
.task-main { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0; }
.task.enter { animation: enter .45s cubic-bezier(.3, 1.3, .5, 1); }
@keyframes enter { from { opacity: 0; transform: translateY(-8px) scale(.98); } }

/* The check: the circle fills with a pop, the tick draws itself, a ring and a few sparks go out. */
.check {
  position: relative; width: 26px; height: 26px; margin-top: -1px; border-radius: 50%; border: 2px solid var(--teal); background: transparent; cursor: pointer; padding: 0;
  display: grid; place-items: center; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: background .2s ease, box-shadow .2s ease, transform .3s cubic-bezier(.3, 1.6, .5, 1);
}
@media (hover: hover) { .check:hover { box-shadow: 0 0 0 4px var(--teal-soft); } }
.check:active { transform: scale(.86); transition-duration: .08s; }
.check svg { width: 14px; height: 14px; color: var(--teal); opacity: 0; transition: opacity .2s ease; }
.check svg path { stroke-dasharray: 15; stroke-dashoffset: 15; transition: stroke-dashoffset .3s cubic-bezier(.6, 0, .3, 1) .06s; }
@media (hover: hover) {
  .task:not(.done):not(.completing) .check:hover svg { opacity: .45; }
  .task:not(.done):not(.completing) .check:hover svg path { stroke-dashoffset: 0; }
}
.task.done .check, .task.completing .check { background: var(--teal); }
.task.done .check svg, .task.completing .check svg { opacity: 1; color: var(--teal-ink); }
.task.done .check svg path, .task.completing .check svg path { stroke-dashoffset: 0; }
.task.completing .check { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(.78); } 45% { transform: scale(1.2); } 100% { transform: scale(1); } }
.check::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--teal); opacity: 0; pointer-events: none; }
.task.completing .check::after { animation: ring .6s ease-out; }
@keyframes ring { from { opacity: .55; transform: scale(1); } to { opacity: 0; transform: scale(2.2); } }
.spark {
  position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: var(--c); pointer-events: none;
  animation: spark .62s cubic-bezier(.2, .7, .3, 1) forwards;
}
@keyframes spark {
  from { opacity: 1; transform: rotate(var(--a)) translateY(-10px) scale(1); }
  to { opacity: 0; transform: rotate(var(--a)) translateY(-26px) scale(.3); }
}
.t-text { overflow-wrap: anywhere; font-size: 15px; transition: color .3s ease .12s; }
/* The strike is drawn left to right instead of appearing all at once. */
.t-text .tt {
  background-image: linear-gradient(currentColor, currentColor); background-repeat: no-repeat; background-position: 0 58%; background-size: 0% 1.5px;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
  transition: background-size .4s cubic-bezier(.6, 0, .3, 1) .14s;
}
.task.done .t-text, .task.completing .t-text { color: var(--muted); }
.task.done .t-text .tt, .task.completing .t-text .tt { background-size: 100% 1.5px; }
.task.leaving { overflow: hidden; transition: height .3s cubic-bezier(.5, 0, .3, 1), opacity .25s ease, border-color .3s ease; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 2px 9px 2px 7px; border-radius: 999px; background: var(--teal-soft); color: var(--ink); font-variant-numeric: tabular-nums; }
.chip svg { width: 12px; height: 12px; color: var(--teal); }
.chip.quiet { background: transparent; color: var(--muted); padding-left: 0; }
.chip.quiet svg { color: var(--muted); }
.chip.snooze { background: var(--amber-soft); } .chip.snooze svg { color: var(--amber); }
.icon-btn { border: 0; background: transparent; color: var(--muted); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
.icon-btn:hover { background: var(--panel-2); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }
.editor { padding: 2px 0 14px 36px; display: grid; gap: 10px; }
.editor-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.editor-actions .spacer { flex: 1; }

.empty { display: grid; gap: 4px; padding: 26px 0 10px; color: var(--muted); }
.empty strong { font-family: var(--f-display); font-weight: 500; color: var(--ink); font-size: 17px; }
.store-note { font-size: 12px; color: var(--muted); padding-top: 16px; }

/* ---------- Frosty's note: what he says, when the couch is scrolled out of view ---------- */
.note {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 19; width: min(380px, calc(100vw - 32px));
  display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 10px; align-items: center;
  background: var(--panel); border: 1.5px solid var(--brass); border-radius: 16px; padding: 10px 14px 10px 10px;
  box-shadow: 0 18px 36px -16px var(--shadow); cursor: pointer;
  opacity: 0; visibility: hidden; transform: translate(-50%, 14px) scale(.97);
  transition: opacity .3s ease, transform .4s cubic-bezier(.3, 1.4, .5, 1), visibility 0s linear .4s;
}
.note.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition-delay: 0s; }
.note { position: fixed; }
.note img { width: 38px; height: auto; display: block; }
.note .who { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.note p { margin: 1px 0 0; font-size: 14.5px; line-height: 1.38; overflow-wrap: anywhere; }

/* ---------- reminder toasts ---------- */
.toasts {
  position: fixed; right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: grid; gap: 10px; z-index: 20; width: min(360px, calc(100vw - 32px));
}
.toast {
  background: var(--panel); border: 1.5px solid var(--brass); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 12px;
  box-shadow: 0 20px 40px -18px var(--shadow); animation: rise .35s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.toast img { width: 44px; height: auto; display: block; }
.toast .who { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.toast .what { font-weight: 600; overflow-wrap: anywhere; margin: 2px 0 10px; }
.toast .acts { display: flex; gap: 6px; flex-wrap: wrap; }

@media (max-width: 860px) {
  body { padding-block: 20px 32px; }
  .tray { grid-template-columns: 1fr; height: auto; }
  .scene { height: clamp(290px, 72vw, 430px); }
  .scene::after { top: auto; left: 0; bottom: 0; width: auto; height: 9px; box-shadow: inset 0 1px 0 var(--brass), inset 0 -1px 0 var(--brass), 0 -6px 14px -6px rgba(20, 12, 6, .45); }
  .lists { overflow: visible; }
  .head { padding: 22px 18px 0; } .add { margin: 16px 18px 0; } .alerts { margin: 10px 18px 0; } .lists { padding: 10px 18px 22px; }
  h1 { font-size: 32px; }
  .bubble-anchor { max-width: min(290px, 82vw); }
  .bubble { font-size: 14.5px; padding: 7px 11px; }
}
@media (prefers-reduced-motion: reduce) {
  .frosty.cheer, .toast, .task.enter, .task.completing .check, .task.completing .check::after, .spark { animation: none !important; }
  .bubble, .note, .btn, .seg::before, .check, .check svg path, .t-text, .t-text .tt, .task.leaving { transition: none !important; }
}
.server-form { display: grid; gap: 8px; width: 100%; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-2); }
.server-form label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.server-form .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.alerts .btn.small { padding: 6px 12px; }
</style>
</head>
<body>

<main class="tray">
  <section class="scene" id="scene" aria-label="Frosty standing on the cognac leather couch in the office">
    <div class="stage" id="stage">
      <img class="office" src="assets/office.jpg" alt="The office: a cognac leather couch under the window, a cream swivel chair, stacked ceramic lamp, moon plates and a patterned rug">
      <span class="shade-l cast" aria-hidden="true"></span>
      <span class="shade-l contact" aria-hidden="true"></span>
      <img class="frosty" id="frosty" src="assets/frosty.webp" alt="Frosty the plush snowman, in his green hat and scarf, standing on the couch cushion">
      <img class="cushion" src="assets/office.jpg" alt="" aria-hidden="true">
      <div class="bubble-anchor"><div class="bubble" id="bubble" role="status" aria-live="polite"></div></div>
    </div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="caption"><span class="dot" aria-hidden="true"></span><span><b>Frosty</b>, on the couch</span><span aria-hidden="true">·</span><span id="clock"></span></div>
  </section>

  <section class="panel" aria-labelledby="title">
    <header class="head">
      <div class="eyebrow" id="today"></div>
      <h1 id="title">To Do <em>List</em></h1>
      <p class="summary" id="summary"></p>
    </header>

    <form class="add" id="addForm" autocomplete="off">
      <div class="add-row">
        <label for="newText" class="sr" hidden>New to-do</label>
        <input class="text-in" id="newText" maxlength="240" placeholder="What needs doing?" aria-label="New to-do" enterkeyhint="done">
        <button class="btn" type="submit">Add</button>
      </div>
      <div id="newRemind"></div>
      <div class="err" id="addErr" hidden></div>
    </form>
    <div class="alerts" id="alerts"></div>

    <div class="lists" id="lists"></div>
  </section>
</main>
<div class="toasts" id="toasts" aria-live="assertive"></div>
<div class="note" id="note" role="status" aria-live="polite"><img src="assets/frosty.webp" alt=""><div><div class="who">Frosty</div><p id="noteText"></p></div></div>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
    const ICON = {
    bell: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V7a4 4 0 0 1 8 0v4l1.2 1.4H2.8L4 11Z"/><path d="M6.6 14a1.5 1.5 0 0 0 2.8 0"/></svg>',
    repeat: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5V6a2.5 2.5 0 0 1 2.5-2.5h7.5"/><path d="m10.5 1.5 2 2-2 2"/><path d="M13.5 8.5V10a2.5 2.5 0 0 1-2.5 2.5H3.5"/><path d="m5.5 14.5-2-2 2-2"/></svg>',
    none: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="5.5"/><path d="M4.2 11.8 11.8 4.2"/></svg>',
    check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8.5 3.2 3L13 4.5"/></svg>',
    edit: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.8 2.7a1.6 1.6 0 0 1 2.3 2.3L5.5 12.6 2.5 13.5l.9-3 7.4-7.8Z"/></svg>',
    snooze: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8.5" r="5.5"/><path d="M8 5.8v2.9l1.8 1.2"/></svg>',
  };

  /* ---------- scene layout: cover the panel with the photo, keeping Frosty in view ---------- */
  const scene = $("#scene"), stage = $("#stage"), RATIO = 1206 / 892;
  function layout() {
    const cw = scene.clientWidth, ch = scene.clientHeight; if (!cw || !ch) return;
    const zoom = cw < 600 ? 1.85 : 1.12;
    const W = Math.max(cw, ch * RATIO) * zoom, H = W / RATIO;
    const L = Math.min(0, Math.max(cw - W, cw / 2 - .485 * W)), T = Math.min(0, Math.max(ch - H, ch * (cw < 600 ? .63 : .56) - .5 * H));
    Object.assign(stage.style, { width: W + "px", height: H + "px", left: L + "px", top: T + "px" });
  }
  layout();
  try { new ResizeObserver(layout).observe(scene); } catch { addEventListener("resize", layout); }

  /* ---------- time helpers ---------- */
  const fmtTime = ms => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  function dayDiff(ms) { const a = new Date(); a.setHours(0,0,0,0); const b = new Date(ms); b.setHours(0,0,0,0); return Math.round((b - a) / 864e5); }
  function fmtWhen(ms) {
    const d = dayDiff(ms);
    if (d === 0) return "Today " + fmtTime(ms);
    if (d === 1) return "Tomorrow " + fmtTime(ms);
    if (d === -1) return "Yesterday " + fmtTime(ms);
    return new Date(ms).toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + fmtTime(ms);
  }
  function fmtHHMM(hhmm) { const [h, m] = hhmm.split(":").map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return fmtTime(d); }
  function nextDaily(hhmm, after = Date.now()) { const [h, m] = hhmm.split(":").map(Number); const d = new Date(after); d.setHours(h, m, 0, 0); if (d.getTime() <= after) d.setDate(d.getDate() + 1); return d.getTime(); }
  // Next time a repeating reminder is due, strictly after `after`, in this device's local time.
  // Monthly reminders on the 29th-31st fall on the last day of shorter months.
  function nextRepeat(r, after = Date.now()) {
    const [h, m] = r.time.split(":").map(Number), base = new Date(after);
    if (r.every === "week") {
      for (let k = 0; k <= 7; k++) { const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + k, h, m); if (d.getDay() === Number(r.weekday) && d.getTime() > after) return d.getTime(); }
    } else if (r.every === "month") {
      for (let k = 0; k <= 13; k++) {
        const y = base.getFullYear(), mo = base.getMonth() + k, last = new Date(y, mo + 1, 0).getDate();
        const d = new Date(y, mo, Math.min(Number(r.monthday), last), h, m); if (d.getTime() > after) return d.getTime();
      }
    } else return nextDaily(r.time, after);
    return after + 864e5;
  }
  const isRepeat = t => !!(t && t.remind && t.remind.mode === "repeat");
  const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const ordinal = n => n + (n % 10 === 1 && n !== 11 ? "st" : n % 10 === 2 && n !== 12 ? "nd" : n % 10 === 3 && n !== 13 ? "rd" : "th");
  function repeatLabel(r) {
    if (r.every === "week") return `Every ${WEEKDAYS[r.weekday]} · ${fmtHHMM(r.time)}`;
    if (r.every === "month") return `Monthly on the ${ordinal(Number(r.monthday))} · ${fmtHHMM(r.time)}`;
    return `Every day · ${fmtHHMM(r.time)}`;
  }
  const pad = n => String(n).padStart(2, "0");
  const toDateInput = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const toTimeInput = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  function nextHour() { const d = new Date(); d.setMinutes(0, 0, 0); d.setHours(d.getHours() + 1); return d.getTime(); }

  /* ---------- state + storage ---------- */
  // The list is always kept on this device. When a reminder server is connected it is also
  // kept there, which is what lets the server send notifications while the page is closed.
  const LS = "frosty-list-v1", LS_SERVER = "karens-list-server", LS_PENDING = "karens-list-pending";
  const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v ?? d; } catch { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const CONFIG = window.KAREN_CONFIG || {};
  let tasks = lsGet(LS, {});
  let server = lsGet(LS_SERVER, null);          // { url, key }
  let pending = lsGet(LS_PENDING, {});          // id -> +n (save) or -n (delete), not yet on the server
  let rev = Math.max(0, ...Object.values(pending).map(v => Math.abs(v)));
  let syncError = false;
  const saveLocal = () => lsSet(LS, tasks);
  const newId = () => "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const localTz = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch { return "UTC"; } };

  async function api(method, path, body, s = server) {
    let res;
    try {
      res = await fetch(s.url.replace(/\/+$/, "") + path, { method, headers: { authorization: "Bearer " + s.key, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    } catch { throw new Error("Couldn't reach the reminder server. Check the address and your connection."); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(res.status === 401 ? "That key isn't right." : (data.error || `The reminder server answered ${res.status}.`));
    return data;
  }
  let flushing = null;
  function flush() {
    if (!server) return Promise.resolve();
    if (flushing) return flushing;
    flushing = (async () => {
      for (const id of Object.keys(pending)) {
        const v = pending[id];
        if (v < 0) await api("DELETE", "/api/tasks/" + encodeURIComponent(id));
        else if (tasks[id]) await api("PUT", "/api/tasks/" + encodeURIComponent(id), tasks[id]);
        if (pending[id] === v) { delete pending[id]; lsSet(LS_PENDING, pending); }
      }
    })().then(() => { syncError = false; }, () => { syncError = true; })
      .finally(() => { flushing = null; if (!syncError && Object.keys(pending).length) flush(); render(); });
    return flushing;
  }
  function persist(t) {
    tasks[t.id] = t; saveLocal();
    if (server) { pending[t.id] = ++rev; lsSet(LS_PENDING, pending); flush(); }
  }
  function remove(id) {
    delete tasks[id]; saveLocal();
    if (server) { pending[id] = -(++rev); lsSet(LS_PENDING, pending); flush(); }
  }
  async function load() {
    if (!server) return;
    await flush();
    try {
      const { tasks: list } = await api("GET", "/api/tasks");
      const next = {}; (list || []).forEach(t => { next[t.id] = t; });
      for (const id in pending) { if (pending[id] > 0 && tasks[id]) next[id] = tasks[id]; else if (pending[id] < 0) delete next[id]; }
      tasks = next; saveLocal(); syncError = false;
    } catch { syncError = true; }
    render();
  }
  async function connectServer(url, key) {
    const s = { url: String(url).trim().replace(/\/+$/, ""), key: String(key).trim() };
    if (!/^https:\/\//.test(s.url) && !/^http:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/.test(s.url)) throw new Error("The server address should start with https://");
    if (!s.key) throw new Error("Paste the key from the setup guide.");
    await api("GET", "/api/tasks", null, s);
    server = s; lsSet(LS_SERVER, s);
    for (const id in tasks) pending[id] = ++rev;     // bring this device's to-dos along
    lsSet(LS_PENDING, pending);
    await load();
  }

  /* ---------- reminder controls ---------- */
  function reminderControls(key, r) {
    const mode = r ? r.mode : "none";
    const wrap = document.createElement("div"); wrap.className = "remind";
    const onceMs = r && r.mode === "once" ? r.at : nextHour();
    const dailyT = r && r.mode === "daily" ? r.time : "09:00";
    const today = new Date();
    const rep = r && r.mode === "repeat" ? r : { every: "day", time: "09:00", weekday: today.getDay(), monthday: today.getDate() };
    wrap.innerHTML = `
      <div class="seg" role="radiogroup" aria-label="Reminder">
        ${[["none", "None", "none"], ["once", "Once", "bell"], ["daily", "Until done", "snooze"], ["repeat", "Repeat", "repeat"]].map(([v, l, ic]) =>
          `<input type="radio" name="${key}-mode" id="${key}-${v}" value="${v}" ${v === mode ? "checked" : ""}><label for="${key}-${v}">${ICON[ic]}${l}</label>`).join("")}
      </div>
      <div class="when" data-for="once" ${mode === "once" ? "" : "hidden"}>
        <span>Remind me on</span><input type="date" id="${key}-date" value="${toDateInput(onceMs)}" aria-label="Reminder date">
        <span>at</span><input type="time" id="${key}-time" value="${toTimeInput(onceMs)}" aria-label="Reminder time">
      </div>
      <div class="when" data-for="daily" ${mode === "daily" ? "" : "hidden"}>
        <span>Remind me every day at</span><input type="time" id="${key}-dtime" value="${dailyT}" aria-label="Daily reminder time">
        <span>until it's checked off</span>
      </div>
      <div class="when" data-for="repeat" ${mode === "repeat" ? "" : "hidden"}>
        <span>Every</span>
        <select id="${key}-every" aria-label="How often">
          ${[["day", "day"], ["week", "week"], ["month", "month"]].map(([v, l]) => `<option value="${v}" ${rep.every === v ? "selected" : ""}>${l}</option>`).join("")}
        </select>
        <span class="rep-week" ${rep.every === "week" ? "" : "hidden"}>on <select id="${key}-weekday" aria-label="Day of the week">
          ${WEEKDAYS.map((d, i) => `<option value="${i}" ${Number(rep.weekday) === i ? "selected" : ""}>${d}</option>`).join("")}</select></span>
        <span class="rep-month" ${rep.every === "month" ? "" : "hidden"}>on the <select id="${key}-monthday" aria-label="Day of the month">
          ${Array.from({ length: 31 }, (_, i) => i + 1).map(d => `<option value="${d}" ${Number(rep.monthday) === d ? "selected" : ""}>${ordinal(d)}</option>`).join("")}</select></span>
        <span>at</span><input type="time" id="${key}-rtime" value="${rep.time}" aria-label="Repeat time">
        <span class="hint">It comes back each time, even after you check it off.</span>
      </div>`;
    wrap.addEventListener("change", e => {
      if (e.target.name === key + "-mode") wrap.querySelectorAll(".when").forEach(w => w.hidden = w.dataset.for !== e.target.value);
      if (e.target.id === key + "-every") { $(".rep-week", wrap).hidden = e.target.value !== "week"; $(".rep-month", wrap).hidden = e.target.value !== "month"; }
    });
    wrap.read = () => {
      const m = wrap.querySelector(`input[name="${key}-mode"]:checked`).value;
      if (m === "once") {
        const dv = $(`#${key}-date`, wrap).value, tv = $(`#${key}-time`, wrap).value;
        if (!dv || !tv) return { error: "Pick a date and time for the reminder." };
        const at = new Date(dv + "T" + tv).getTime();
        if (isNaN(at)) return { error: "That date doesn't look right." };
        if (at <= Date.now()) return { error: "Pick a time later than now." };
        return { mode: "once", at };
      }
      if (m === "daily") { const tv = $(`#${key}-dtime`, wrap).value; if (!tv) return { error: "Pick a time for the daily reminder." }; return { mode: "daily", time: tv, tz: localTz() }; }
      if (m === "repeat") {
        const every = $(`#${key}-every`, wrap).value, tv = $(`#${key}-rtime`, wrap).value;
        if (!tv) return { error: "Pick a time for the repeating reminder." };
        const out = { mode: "repeat", every, time: tv, tz: localTz() };
        if (every === "week") out.weekday = Number($(`#${key}-weekday`, wrap).value);
        if (every === "month") out.monthday = Number($(`#${key}-monthday`, wrap).value);
        return out;
      }
      return { mode: "none" };
    };
    return wrap;
  }
  function dueFor(r) { return r.mode === "once" ? r.at : r.mode === "daily" ? nextDaily(r.time) : r.mode === "repeat" ? nextRepeat(r) : null; }

  /* ---------- add form ---------- */
  let addCtl = reminderControls("new", null);
  $("#newRemind").appendChild(addCtl);
  $("#addForm").addEventListener("submit", e => {
    e.preventDefault();
    const text = $("#newText").value.trim(), err = $("#addErr");
    if (!text) { err.textContent = "Type a to-do first."; err.hidden = false; $("#newText").focus(); return; }
    const r = addCtl.read();
    if (r.error) { err.textContent = r.error; err.hidden = false; return; }
    err.hidden = true;
    const t = { id: newId(), text, done: false, createdAt: Date.now(), remind: r, due: dueFor(r), snoozed: false };
    persist(t); justAdded = t.id;
    $("#newText").value = "";
    const fresh = reminderControls("new", null); addCtl.replaceWith(fresh); addCtl = fresh;
    render();
    say(r.mode === "none" ? `Got it: <b>${esc(text)}</b>` : r.mode === "once" ? `I'll remind you ${esc(fmtWhen(r.at))}.`
      : r.mode === "daily" ? `I'll remind you every day at ${esc(fmtHHMM(r.time))} until it's done.`
      : `I'll remind you ${esc(repeatLabel(r).replace(" · ", " at ").replace(/^Every day at/, "every day at").replace(/^Every /, "every ").replace(/^Monthly/, "monthly"))}.`);
    if (matchMedia("(pointer: coarse)").matches) $("#newText").blur(); else $("#newText").focus();
  });

  /* ---------- rendering ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let editing = null, showDone = true, justAdded = null, holdRender = 0, renderWaiting = false;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function chipsFor(t) {
    const c = [];
    if (t.done) {
      c.push(`<span class="chip quiet">${ICON.check}Done ${esc(fmtWhen(t.doneAt || Date.now()))}</span>`);
      if (isRepeat(t) && t.due) c.push(`<span class="chip quiet">${ICON.repeat}Back ${esc(fmtWhen(t.due))}</span>`);
      return c.join("");
    }
    const r = t.remind || { mode: "none" };
    if (t.snoozed && t.due) c.push(`<span class="chip snooze">${ICON.snooze}Snoozed until ${esc(fmtTime(t.due))}</span>`);
    if (r.mode === "once") {
      if (t.due && !t.snoozed) c.push(`<span class="chip">${ICON.bell}${esc(fmtWhen(t.due))}</span>`);
      else if (!t.due) c.push(`<span class="chip quiet">${ICON.bell}Reminded ${esc(fmtWhen(r.at))}</span>`);
    } else if (r.mode === "daily") {
      c.push(`<span class="chip">${ICON.snooze}Daily until done · ${esc(fmtHHMM(r.time))}</span>`);
    } else if (r.mode === "repeat") {
      c.push(`<span class="chip">${ICON.repeat}${esc(repeatLabel(r))}</span>`);
    }
    return c.join("");
  }

  function taskEl(t) {
    const li = document.createElement("li"); li.className = "task" + (t.done ? " done" : "") + (t.id === justAdded ? " enter" : ""); li.dataset.id = t.id;
    li.innerHTML = `
      <div class="task-main">
        <button class="check" type="button" aria-pressed="${t.done}" aria-label="${t.done ? "Mark as not done" : "Check off"}: ${esc(t.text)}">${ICON.check}</button>
        <div style="min-width:0"><div class="t-text"><span class="tt">${esc(t.text)}</span></div><div class="chips">${chipsFor(t)}</div></div>
        <button class="icon-btn" type="button" aria-label="Edit ${esc(t.text)}" aria-expanded="${editing === t.id}">${ICON.edit}</button>
      </div>`;
    $(".check", li).addEventListener("click", () => toggle(t.id));
    $(".icon-btn", li).addEventListener("click", () => { editing = editing === t.id ? null : t.id; render(); if (editing) $("#edit-" + t.id + "-text")?.focus(); });
    if (editing === t.id) li.appendChild(editorEl(t));
    return li;
  }

  function editorEl(t) {
    const box = document.createElement("div"); box.className = "editor";
    box.innerHTML = `<input class="text-in" id="edit-${t.id}-text" maxlength="240" value="${esc(t.text)}" aria-label="To-do text">`;
    const ctl = reminderControls("edit-" + t.id, t.done ? null : t.remind); if (!t.done) box.appendChild(ctl);
    const err = document.createElement("div"); err.className = "err"; err.hidden = true; box.appendChild(err);
    const acts = document.createElement("div"); acts.className = "editor-actions";
    acts.innerHTML = `<button class="btn small" type="button" data-a="save">Save</button><button class="btn small ghost" type="button" data-a="cancel">Cancel</button><span class="spacer"></span><button class="btn small danger" type="button" data-a="del">Delete</button>`;
    box.appendChild(acts);
    acts.addEventListener("click", e => {
      const a = e.target.closest("button")?.dataset.a; if (!a) return;
      if (a === "cancel") { editing = null; render(); return; }
      if (a === "del") { remove(t.id); editing = null; render(); say("Deleted."); return; }
      const text = $("#edit-" + t.id + "-text", box).value.trim();
      if (!text) { err.textContent = "A to-do needs some words."; err.hidden = false; return; }
      const n = { ...t, text };
      if (!t.done) {
        const r = ctl.read();
        const same = JSON.stringify({ ...r, tz: undefined }) === JSON.stringify({ ...t.remind, tz: undefined });
        if (r.error && !same) { err.textContent = r.error; err.hidden = false; return; }
        if (!r.error && !same) { n.remind = r; n.due = dueFor(r); n.snoozed = false; n.openedByFire = false; }
      }
      persist(n); editing = null; render(); say("Saved.");
    });
    box.addEventListener("keydown", e => { if (e.key === "Escape") { editing = null; render(); } if (e.key === "Enter" && e.target.matches(".text-in")) acts.querySelector('[data-a="save"]').click(); });
    return box;
  }

  function render() {
    if (holdRender) { renderWaiting = true; return; }     // let a check-off finish its little show first
    renderWaiting = false;
    const all = Object.values(tasks);
    const open = all.filter(t => !t.done).sort((a, b) => a.createdAt - b.createdAt);
    const done = all.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    const now = new Date();
    $("#today").textContent = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
    $("#clock").textContent = fmtTime(now);

    const withRem = open.filter(t => t.due).sort((a, b) => a.due - b.due);
    let s = open.length ? `<b>${open.length}</b> to do` : "All clear";
    if (withRem.length) s += ` · next reminder ${esc(fmtWhen(withRem[0].due))}`;
    else if (done.length && !open.length) s += ` · ${done.length} done`;
    $("#summary").innerHTML = s;

    const L = $("#lists"); L.innerHTML = "";
    const h = (title, n, extra = "") => { const d = document.createElement("div"); d.className = "group-h"; d.innerHTML = `<h2>${title}</h2><span class="count">${extra || n}</span>`; return d; };
    if (!open.length) {
      const e = document.createElement("div"); e.className = "empty";

    "What we can't remember, we tend to repeat. What we understand, we can choose.",
    "You don't have to resolve your whole past to live well today.",
    "Feelings that get named lose some of their grip.",
    "Some feelings arrive before words. Give them time to find theirs.",
    "You can hold a hard feeling without being swallowed by it.",
    "Staying with a feeling, without rushing to fix it, is its own kind of strength.",
    "Dreams, slips and moods are the mind speaking sideways. Listen kindly.",
    "Some days the work is simply staying in touch with yourself.",
    "Nobody is only one thing. There's room for all of you today.",
    "Good and bad can live in the same day, and the same person. Both are real.",
    "Ambivalence isn't a problem to solve. It's what caring looks like up close.",
    "Even the parts of you that frustrate you are trying to protect something.",
    "Envy and admiration are close cousins. Both point to what you value.",
    "We're made of our relationships, and new ones keep shaping us. That's hopeful.",
    "No one becomes themselves alone. Let someone matter to you today.",
    "The capacity to be quietly alone is one of the mind's real achievements.",
    "Wanting things isn't a flaw. Desire is part of being alive.",
    "Small pleasures count. They're how a life gets lived, not a reward for it.",
    "Play is how grown-ups keep a mind alive. Leave a little room for it.",

  ];
  function nextGreeting() {
    let bag = []; try { bag = JSON.parse(localStorage.getItem("frosty-greeting-bag") || "[]"); } catch {}
    bag = bag.filter(i => i < greetings.length);
    if (!bag.length) { bag = greetings.map((_, i) => i); for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; } }
    const i = bag.pop(); try { localStorage.setItem("frosty-greeting-bag", JSON.stringify(bag)); } catch {}
    return greetings[i];
  }
  function greet() {
    const h = new Date().getHours();
    const hello = h >= 5 && h < 12 ? "Good morning, Karen." : h >= 12 && h < 17 ? "Good afternoon, Karen." : h >= 17 && h < 22 ? "Good evening, Karen." : "Hello, Karen.";
    say(`<b>${hello}</b> ${esc(nextGreeting())}`, 0);
  }
  setTimeout(greet, 700);
  let hiddenAt = 0;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt >= 15 * 60e3) setTimeout(greet, 400);
  });
})();
